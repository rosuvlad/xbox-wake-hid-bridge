name: Build

# Shared by ci.yml and release.yml so that what CI proves green is built the
# same way as what gets released.
on:
  workflow_call:
    inputs:
      version:
        description: Stamped into the firmware as FW_VERSION.
        required: true
        type: string
      upload:
        description: Keep each board's images as artifacts for the release job to publish.
        default: false
        type: boolean

jobs:
  # Gate every board build on the host-side unit tests. Because release.yml and
  # ci.yml both build through here, a red test blocks both a branch build and a
  # release — nothing ships untested.
  test:
    uses: ./.github/workflows/tests.yml

  boards:
    name: Discover boards
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.discover.outputs.boards }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        # Every [env:NAME] in platformio.ini is a board we ship, so adding a
        # board there is all it takes to get it built and released. Two things
        # are deliberately not boards and are filtered out: the shared [fw]
        # section (no colon, so the pattern already skips it) and [env:native],
        # which is the host-side unit-test env — `pio run -e native` has no
        # firmware to build.
        run: |
          boards=$(sed -n 's/^\[env:\([^]]*\)\]/"\1"/p' platformio.ini \
            | grep -vx '"native"' | paste -sd, -)
          echo "boards=[$boards]" >> "$GITHUB_OUTPUT"
          echo "Building: [$boards]"

  build:
    name: ${{ matrix.board }}
    needs: [boards, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.boards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.board }}
        env:
          FW_VERSION: ${{ inputs.version }}
        # mergebin runs even when nothing is uploaded: it costs about a second
        # and it means a broken release script fails on the branch that broke
        # it rather than on main.
        run: |
          pio run -e "${{ matrix.board }}"
          pio run -e "${{ matrix.board }}" -t mergebin
      - uses: actions/upload-artifact@v7
        if: inputs.upload
        with:
          name: ${{ matrix.board }}
          path: .pio/build/${{ matrix.board }}/release/
          if-no-files-found: error
