; PlatformIO Project Configuration File
;
; Xbox Controller USB Wake Bridge — ESP32-S3
; Milestone 1: user-friendly OOBE pairing + live controller debug view.
; See docs/xbox-controller-usb-wake-bridge-spec-v0.3.md for the final target.

[platformio]
;! Don't change — LilyGO ships a custom board definition in ./board
boards_dir = ./board

;device serial number : K192,H579,H590
default_envs = T-QT-Pro-N4R2

;device serial number : K191,H628,H588
; default_envs = T-QT-Pro-N8

; Settings shared by the firmware boards below.
;
; Deliberately not [env]: that section applies to *every* environment, and
; [env:native] — which runs the unit tests on this machine — has no board, no
; framework and no Arduino toolchain. Boards opt in with `extends = fw`.
[fw]
platform = espressif32@6.12.0
board = esp32-s3-t-qt-pro
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; fw_version.py stamps the build with FW_VERSION; merge_bin.py adds the
; `mergebin` target that CI releases. Every [env:...] below is built and
; released by .github/workflows — adding a board here is enough.
extra_scripts =
    pre:scripts/fw_version.py
    post:scripts/merge_bin.py

; Xbox Series controller over BLE via NimBLE (matches spec's stack).
; Pinned to the stable NimBLE 1.4.x + asukiaaa 1.0.x combo that is known
; to link the Xbox pad reliably on the ESP32-S3 (BLE 5) Arduino core.
;
; The asukiaaa half of that pin is vendored in lib/ rather than fetched: the
; registry unpublished the entire 1.0.x line in 2026-08 (1.1.1 is now the oldest
; available), which broke every CI build outright. Vendoring keeps the exact
; code the pin always meant, and takes the pad link — the one thing here that
; cannot be verified without hardware — off the registry's release schedule.
; Its two asukiaaa dependencies are vendored alongside it for the same reason.
; See lib/README.md.
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Native USB is the Xbox HID gamepad (not a serial console), so CDC-on-boot
    ; is off — this lets us own the USB identity (Microsoft VID/PID, HID-only).
    -DARDUINO_USB_CDC_ON_BOOT=0

; PlatformIO compiles every file in src/, so each board must exclude the
; presentation backend it does not use. See src/Ux.h.
build_src_filter = +<*> -<UiLed.cpp>

;FLASH = 4M PSRAM = 2M
[env:T-QT-Pro-N4R2]
extends = fw
build_flags =
    ${fw.build_flags}
    -DBOARD_HAS_PSRAM

;FLASH = 8M ,NO PSRAM
[env:T-QT-Pro-N8]
extends = fw
build_flags =
    ${fw.build_flags}

; Headless: any generic ESP32-S3 dev board, using its onboard LED and BOOT
; button instead of a screen. The stock board id is deliberate — boards_dir
; above *adds* ./board to PlatformIO's built-in list rather than replacing it,
; and esp32-s3-devkitc-1 already sets ARDUINO_USB_MODE=1 exactly like the T-QT
; definition does, so the USB HID identity and the wake path are unchanged.
;
; Defaults live in src/Config.h (LED_PIN 38 = DevKitC-1 v1.1). Override per
; board without editing this file:
;   PLATFORMIO_BUILD_FLAGS="-DLED_PIN=48" pio run -e S3-DevKit-LED   ; v1.0
;   PLATFORMIO_BUILD_FLAGS="-DLED_KIND=LED_MONO -DLED_PIN=21 -DLED_ACTIVE_LOW=1"
[env:S3-DevKit-LED]
extends = fw
board = esp32-s3-devkitc-1
build_flags =
    ${fw.build_flags}
    -DUX_LED=1
build_src_filter = +<*> -<Ui.cpp>
; The dependency finder's default `chain` mode regex-scans includes without
; evaluating #if, so it would drag both of these in through Ux.h despite the
; guard. Ignoring them is deterministic, and fails loudly if the guard leaks.
lib_ignore =
    TFT_eSPI
    OneButton

; ESP32-S3 SuperMini — a tiny (22x18mm) generic S3 board. Same code as the
; DevKitC env, but three board facts differ:
;   * WS2812 on GPIO48 (not 38)          -> -DLED_PIN=48
;   * 4 MB flash, no PSRAM               -> a 4 MB flash + partition layout, or
;                                           the 8 MB DevKitC default overruns it
;   * one native-USB Type-C, no UART     -> flash via download mode (README)
[env:S3-SuperMini-LED]
extends = fw
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
build_flags =
    ${fw.build_flags}
    -DUX_LED=1
    -DLED_PIN=48
build_src_filter = +<*> -<Ui.cpp>
lib_ignore =
    TFT_eSPI
    OneButton

; Host-side unit tests: `pio test -e native`.
;
; LedPattern.h and HoldButton.h are pure — stdint.h only, with time passed in
; rather than read from millis() — so the tests need no Arduino stubs and no
; hardware. This is not a board: .github/workflows/build.yml filters it out of
; the release matrix.
[env:native]
platform = native
test_framework = unity
build_flags =
    -I src
    -std=gnu++17
    -Wall
